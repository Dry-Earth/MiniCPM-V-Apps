name: qnn-v79

# Compiles the MiniCPM-OCR 1.0 vision tower into a Hexagon **V79** context
# binary (Snapdragon 8 Elite / SM8750).
#
# Why this is not shipped with the app: a context binary is bound to one DSP
# architecture and to the QAIRT minor version that produced it. Upstream only
# publishes the V85 build, and the bundled runtime + skel must come from the
# *same* QAIRT release, so the pair has to be regenerated together.
#
# Input to the pipeline is public: scripts/qnn/convert/extract_weights.py reads
# the published 4x mmproj GGUF, so no PyTorch checkpoints are needed.

on:
  workflow_dispatch:
    inputs:
      qairt_version:
        description: "QAIRT (Community Edition) version"
        default: "2.52.1.261105"
        type: string
      arch:
        description: "Hexagon arch to target (8 Elite = v79)"
        default: "v79"
        type: string
      release_tag:
        description: "Optional: publish to a private repo release as <tag>"
        default: ""
        type: string

concurrency:
  group: qnn-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build-context-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      QAIRT_VERSION: ${{ inputs.qairt_version }}
      ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3 GB zip + ~1.5 GB extracted + 0.9 GB mmproj + 0.9 GB dlc + 0.9 GB bin.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch QAIRT runtime + converter
        run: |
          set -euo pipefail
          URL="https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QAIRT_VERSION}/v${QAIRT_VERSION}.zip"
          # GET, not HEAD: the CDN answers 403 to HEAD requests.
          curl -fL --retry 5 --retry-all-errors -o /tmp/qairt.zip "$URL"
          unzip -q /tmp/qairt.zip -d /tmp/qairt
          rm -f /tmp/qairt.zip
          QROOT=$(find /tmp/qairt -maxdepth 4 -name QnnSdkBuildId.h -printf '%h\n' | head -1)
          QROOT=$(cd "$QROOT/../.." && pwd)
          echo "QAIRT_ROOT=$QROOT" >> "$GITHUB_ENV"
          grep BUILD_ID "$QROOT/include/QNN/QnnSdkBuildId.h"
          test -x "$QROOT/bin/x86_64-linux-clang/qairt-converter"
          test -f "$QROOT/lib/hexagon-$ARCH/unsigned/libQnnHtpV${ARCH#v}Skel.so"

      - name: Install python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # CPU wheel: the converter does not need a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # onnx must stay 1.18.x: QAIRT reads onnx.version.version, which 1.23 removed.
          pip install "onnx==1.18.0" numpy pyyaml packaging gguf onnxruntime pillow

      - name: Download OCR mmproj (4x)
        run: |
          set -euo pipefail
          NAME="MiniCPM-OCR-1_0-mmproj-F16-4x.gguf"
          DIR="MiniCPM-OCR-1.0"
          HF="https://huggingface.co/tc-mb/MiniCPM-V-Apps-gguf/resolve/main/$DIR/$NAME"
          MS="https://www.modelscope.cn/models/zerg13/MiniCPM-V-Apps-gguf/resolve/master/$DIR/$NAME"
          mkdir -p work
          curl -fL --retry 3 --retry-all-errors -o "work/$NAME" "$HF" \
            || curl -fL --retry 3 --retry-all-errors -o "work/$NAME" "$MS"
          ls -lh "work/$NAME"

      - name: Export the vision tower to ONNX
        run: |
          set -euo pipefail
          cd scripts/qnn
          python convert/extract_weights.py \
            "../../work/MiniCPM-OCR-1_0-mmproj-F16-4x.gguf" "$GITHUB_WORKSPACE/work/vit.pt"
          python convert/export_onnx.py "$GITHUB_WORKSPACE/work/vit.pt" 0 0 \
            "$GITHUB_WORKSPACE/work/minicpm-ocr-vit.onnx" \
            --layout linear --fp16

      - name: Convert to a ${{ inputs.arch }} context binary
        working-directory: scripts/qnn
        env:
          QAIRT: ${{ env.QAIRT_ROOT }}
          LD_LIBRARY_PATH: ${{ env.QAIRT_ROOT }}/lib/x86_64-linux-clang
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/work"
          cp -r "$GITHUB_WORKSPACE/scripts/qnn/convert" ./convert
          NAME="minicpm-ocr-qnn-${ARCH}"
          bash ./convert/convert_to_dlc.sh minicpm-ocr-vit.onnx "$NAME" "$ARCH"
          # The app resolves `minicpm-ocr-qnn-v<arch>.bin` inside the model dir.
          ls -lh "$NAME.bin"
          md5sum "$NAME.bin" | tee "$NAME.bin.md5"
          rm -f "$NAME.dlc"

      - name: Sanity check
        run: |
          set -euo pipefail
          BIN="work/minicpm-ocr-qnn-${ARCH}.bin"
          SIZE=$(stat -c %s "$BIN")
          echo "size=$SIZE"
          # Upstream's V85 build is ~868 MB; anything far off means the graph
          # did not actually take the 4x tower.
          [ "$SIZE" -gt 500000000 ] || { echo "binary looks too small"; exit 1; }
          echo "### QNN ${ARCH} context binary" >> "$GITHUB_STEP_SUMMARY"
          echo "- QAIRT: $(grep -oP 'v\K[0-9.]+' "$QAIRT_ROOT/include/QNN/QnnSdkBuildId.h")" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- md5: $(cut -d' ' -f1 "work/minicpm-ocr-qnn-${ARCH}.bin.md5")" >> "$GITHUB_STEP_SUMMARY"

      # Artifacts count against the 500 MB free storage quota, so prefer the
      # release path when the binary has to be kept around.
      - name: Publish to a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.QAIRT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "release_tag given but QAIRT_RELEASE_TOKEN is not set" >&2
            exit 1
          fi
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.release_tag }}" \
                 --title "MiniCPM-OCR QNN ${ARCH}" --notes "QAIRT ${QAIRT_VERSION}"
          gh release upload "${{ inputs.release_tag }}" \
            "work/minicpm-ocr-qnn-${ARCH}.bin" "work/minicpm-ocr-qnn-${ARCH}.bin.md5" --clobber

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release_tag == '' }}
        with:
          name: minicpm-ocr-qnn-${{ inputs.arch }}
          path: |
            work/minicpm-ocr-qnn-${{ inputs.arch }}.bin
            work/minicpm-ocr-qnn-${{ inputs.arch }}.bin.md5
          retention-days: 2
          compression-level: 0
