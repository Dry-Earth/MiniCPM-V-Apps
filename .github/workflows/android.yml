name: android

# Builds the arm64-v8a APK on a plain ubuntu runner.
#
# Two things make a clean checkout buildable here that are not obvious:
#   1. the llama.cpp-omni submodule must be fetched (CMake fails without it), and
#   2. the QAIRT headers are not in the repo, so the native build falls back to
#      the QNN stub unless `ENABLE_QNN` is set (see the NPU step below).

on:
  workflow_dispatch:
    inputs:
      enable_qnn:
        description: "Also package the Hexagon NPU runtime (downloads QAIRT)"
        type: boolean
        default: false
      enable_vulkan:
        description: "Build the Vulkan (Adreno GPU) backend instead of CPU-only"
        type: boolean
        default: false
      enable_opencl:
        description: "Vendor the upstream Adreno OpenCL backend (GPU, recommended over Vulkan)"
        type: boolean
        default: false
      enable_hexagon:
        description: "Vendor the upstream Hexagon NPU backend (V79 skel, prebuilt+signed)"
        type: boolean
        default: false
      release_tag:
        description: "Optional: publish the APK to this release tag"
        type: string
        default: ""
  push:
    branches: [ main, "feat/**" ]
    paths-ignore:
      - "**.md"

concurrency:
  group: android-${{ github.ref }}-${{ inputs.enable_vulkan }}-${{ inputs.enable_opencl }}-${{ inputs.enable_hexagon }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANDROID_NDK_VERSION: "27.0.12077973"
      CMAKE_VERSION: "4.1.2"
      QAIRT_VERSION: "2.52.1.261105"
      # GitHub runners sit outside China; Aliyun mirrors are the slower option there.
      MINICPMV_CN_MIRRORS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # The runner image ships ~14 GB free; NDK + SDK + a full llama.cpp build
      # does not fit alongside all the preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"
          # compileSdk 36.1 needs the minor-level platform on some AGP builds;
          # installing it is harmless when it does not exist.
          sdkmanager --install "platforms;android-36.1" || \
            sdkmanager --install "platforms;android-36" || true
          sdkmanager --install "build-tools;36.1.0" || true
          test -d "$ANDROID_HOME/ndk/27.0.12077973" || { echo "NDK missing"; exit 1; }
          test -x "$ANDROID_HOME/cmake/4.1.2/bin/cmake" || { echo "cmake 4.1.2 missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Optional: the crate-NPU path needs QAIRT 2.5x headers + libs. Without
      # them CMakeLists.txt compiles qnn_vit_stub.cpp and OCR stays on CPU.
      - name: Package Hexagon NPU runtime
        if: ${{ inputs.enable_qnn || vars.ENABLE_QNN == 'true' }}
        run: |
          set -euo pipefail
          URL="https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QAIRT_VERSION}/v${QAIRT_VERSION}.zip"
          # NOTE: use GET, not HEAD - the CDN answers 403 to HEAD.
          curl -fL --retry 5 --retry-all-errors -o /tmp/qairt.zip "$URL"
          mkdir -p /tmp/qairt && unzip -q /tmp/qairt.zip -d /tmp/qairt
          QROOT=$(find /tmp/qairt -maxdepth 3 -name QnnSdkBuildId.h -printf '%h\n' | head -1)/../..
          QROOT=$(cd "$QROOT" && pwd)
          echo "QAIRT root: $QROOT"
          APP=MiniCPM-V-demo-Android/app/src/main
          mkdir -p "$APP/jniLibs/arm64-v8a" "$APP/assets/qnn" "$APP/cpp/qnn-include"
          cp "$QROOT"/lib/aarch64-android/libQnnHtp.so \
             "$QROOT"/lib/aarch64-android/libQnnSystem.so \
             "$QROOT"/lib/aarch64-android/libQnnHtpV79Stub.so \
             "$APP/jniLibs/arm64-v8a/"
          cp "$QROOT"/lib/hexagon-v79/unsigned/libQnnHtpV79Skel.so "$APP/assets/qnn/"
          cp -r "$QROOT"/include/QNN "$APP/cpp/qnn-include/"

      # Adreno GPU path. The NDK already ships vulkan/vulkan.h and the
      # libvulkan.so stub, so the host only needs glslc (shader compiler) and
      # the headers CMake's find_package(Vulkan) looks for.
      - name: Vulkan toolchain
        if: ${{ inputs.enable_vulkan }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "MINICPMV_GLSLC=$(command -v glslc)" >> "$GITHUB_ENV"
          # NDK ships vulkan.h but not the C++ binding (vulkan.hpp), and
          # FindVulkan does not attach Vulkan_INCLUDE_DIR to Vulkan::Vulkan when
          # cross-compiling, so the flag never reaches the compile line. Copy the
          # headers (same 1.3.275 revision) into the sysroot instead: the clang
          # driver always searches $SYSROOT/usr/include.
          # vulkan_core.h pulls in vk_video/*.h, and ggml-vulkan.cpp includes
          # spirv/unified1/spirv.hpp from SPIRV-Headers. The NDK sysroot has
          # neither, and clang for Android does not search the host /usr/include.
          sudo cp -r /usr/include/vulkan /usr/include/vk_video /usr/include/spirv \
            "$SYSROOT/usr/include/"
          echo "MINICPMV_VULKAN_INCLUDE=$SYSROOT/usr/include" >> "$GITHUB_ENV"
          echo "MINICPMV_VULKAN_LIBRARY=$SYSROOT/usr/lib/aarch64-linux-android/24/libvulkan.so" >> "$GITHUB_ENV"
          SPIRV_DIR=$(dirname "$(dpkg -L spirv-headers | grep 'SPIRV-HeadersConfig.cmake' | head -1)")
          echo "MINICPMV_SPIRV_DIR=$SPIRV_DIR" >> "$GITHUB_ENV"
          glslc --version | head -2
          ls -d "$SYSROOT/usr/include/vulkan" "$SYSROOT/usr/include/vk_video" "$SYSROOT/usr/include/spirv"
          ls -l "$SYSROOT/usr/lib/aarch64-linux-android/24/libvulkan.so"
          echo "SPIRV-Headers config: $SPIRV_DIR"

      # The NDK's API-24 libvulkan.so stub predates Vulkan 1.1 and therefore
      # does not export the core vkGetPhysicalDeviceFeatures2. The KHR alias is
      # the same entry point, was an extension in 1.0, and the on-device loader
      # exports both. Three direct calls in ggml-vulkan.cpp; the C++ (HPP) paths
      # use the dynamic dispatcher and are unaffected.
      - name: Align ggml-vulkan with the Android stub
        if: ${{ inputs.enable_vulkan }}
        run: |
          set -euo pipefail
          F=llama.cpp-omni/ggml/src/ggml-vulkan/ggml-vulkan.cpp
          sed -i 's/vkGetPhysicalDeviceFeatures2(/vkGetPhysicalDeviceFeatures2KHR(/g' "$F"
          N=$(grep -c "vkGetPhysicalDeviceFeatures2KHR" "$F")
          echo "patched call sites: $N"
          test "$N" -eq 3

          # This fork's vulkan-shaders-gen never emits cooperative-matrix ("_cm1")
          # variants for the iq3_s / iq4_nl / iq4_xs / mxfp4 / nvfp4 matmul_id
          # shaders, but the dispatch code references them unconditionally, so
          # the link fails with 18 undefined symbols. Disable the coopmat paths
          # (plain compute shaders still run on the GPU) rather than patch the
          # generator.
          sed -i 's|^#if defined(VK_KHR_cooperative_matrix) && defined(GGML_VULKAN_COOPMAT_GLSLC_SUPPORT)$|#if 0 /* coopmat disabled: no cm1 shaders for these quants in this fork */|' "$F"
          sed -i 's|^#if defined(GGML_VULKAN_COOPMAT_GLSLC_SUPPORT)$|#if 0 /* coopmat disabled */|' "$F"
          test "$(grep -c '^#if 0 /\* coopmat' "$F")" -eq 9

      # Upstream ships a Snapdragon Android build that already contains the two
      # backends this fork's registry looks for by name (see
      # ggml_backend_load_all_from_path: it probes "opencl" and "hexagon").
      # Reusing those .so avoids needing the Qualcomm OpenCL/Hexagon SDK here.
      #
      # Ship only one of them per build: both register as DEVICE_TYPE_GPU, so
      # with two present llama.cpp would silently pick whichever comes first.
      - name: Vendor Snapdragon backends
        if: ${{ inputs.enable_opencl || inputs.enable_hexagon }}
        run: |
          set -euo pipefail
          TAG="b12470"
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-android-arm64-snapdragon.tar.gz"
          curl -fL --retry 5 --retry-all-errors -o /tmp/snap.tgz "$URL"
          mkdir -p /tmp/snap && tar xzf /tmp/snap.tgz -C /tmp/snap
          DEST=MiniCPM-V-demo-Android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"

          copy_one() {
            local name="$1"
            local src
            src=$(find /tmp/snap -name "$name" -type f | head -1)
            if [ -z "$src" ]; then echo "missing $name in the upstream tarball" >&2; exit 1; fi
            cp "$src" "$DEST/"
            echo "$name <- $src ($(stat -c %s "$src") bytes)"
          }

          if [ "${{ inputs.enable_opencl }}" = "true" ]; then
            copy_one libggml-opencl.so
          fi
          if [ "${{ inputs.enable_hexagon }}" = "true" ]; then
            copy_one libggml-hexagon.so
            copy_one libggml-htp-v79.so
          fi

          # Guard against a wrong-architecture drop-in. The HTP skel is
          # deliberately excluded: it is a Hexagon DSP object (ELF for
          # Q6/Hexagon), not an ARM one.
          for f in libggml-opencl.so libggml-hexagon.so; do
            p="$DEST/$f"
            if [ -f "$p" ]; then
              file "$p" | grep -q "ARM aarch64" || { echo "$p is not aarch64"; exit 1; }
            fi
          done
          file "$DEST"/libggml-htp-v79.so || true

      - name: Prepare signing key
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/sign/release.jks" \
              -alias minicpmv -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass minicpmv -keypass minicpmv \
              -dname "CN=MiniCPM-V Demo, OU=ci, O=local, L=-, S=-, C=CN"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain diagnostics
        run: |
          set +e
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            java -version 2>&1
            ls "$ANDROID_HOME/platforms" 2>&1
            ls "$ANDROID_HOME/build-tools" 2>&1
            ls "$ANDROID_HOME/ndk" 2>&1
            ls "$ANDROID_HOME/cmake" 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        id: build
        working-directory: MiniCPM-V-demo-Android
        run: |
          set -o pipefail
          VULKAN_ARG=""
          if [ "${{ inputs.enable_vulkan }}" = "true" ]; then
            VULKAN_ARG="-Pminicpmv.vulkan=true"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain $VULKAN_ARG \
            -PMINICPMV_KEYSTORE="$RUNNER_TEMP/sign/release.jks" \
            -PMINICPMV_KEYSTORE_PASSWORD=minicpmv \
            -PMINICPMV_KEY_ALIAS=minicpmv \
            -PMINICPMV_KEY_PASSWORD=minicpmv 2>&1 | tee /tmp/build.log
          # pipefail is on, but without `exit` the step would inherit tee's
          # status and a failed build would be reported as green.
          status=${PIPESTATUS[0]}
          echo "gradle_exit=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The run log needs repository admin rights to download through the API,
      # so surface the tail in the (readable) job summary as well.
      - name: Show build log tail
        if: failure()
        run: |
          {
            echo '### Gradle failure (last 150 lines)'
            echo '```'
            tail -150 /tmp/build.log 2>/dev/null || echo "no log captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-log
          path: /tmp/build.log
          retention-days: 3

      - name: Verify and rename
        run: |
          set -euo pipefail
          APK=$(find MiniCPM-V-demo-Android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify -v "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package' || true
          VERSION=$(grep -oP 'versionName = "\K[^"]+' MiniCPM-V-demo-Android/app/build.gradle.kts)
          mkdir -p dist
          cp "$APK" "dist/MiniCPM-V-demo-Android-v${VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk${{ inputs.enable_vulkan && '-vulkan' || '' }}${{ inputs.enable_opencl && '-opencl' || '' }}${{ inputs.enable_hexagon && '-hexagon' || '' }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish to a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' MiniCPM-V-demo-Android/app/build.gradle.kts)
          SUFFIX=""
          [ "${{ inputs.enable_opencl }}" = "true" ] && SUFFIX="${SUFFIX}-opencl"
          [ "${{ inputs.enable_hexagon }}" = "true" ] && SUFFIX="${SUFFIX}-hexagon"
          [ "${{ inputs.enable_vulkan }}" = "true" ] && SUFFIX="${SUFFIX}-vulkan"
          OUT="MiniCPM-V-Demo-Android-v${VERSION}${SUFFIX}.apk"
          cp "$(find dist -name '*.apk' | head -1)" "/tmp/${OUT}"
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "v2.7 test builds" --notes "Personal builds: CPU / OpenCL / Hexagon / Vulkan" --prerelease || true
          gh release upload "$TAG" "/tmp/${OUT}" --clobber
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- /tmp/${OUT} -> $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android build"
            echo "- QNN packaged: ${{ inputs.enable_qnn || vars.ENABLE_QNN == 'true' }}"
            echo "- Vulkan (Adreno): ${{ inputs.enable_vulkan }}"
            echo "- OpenCL (Adreno): ${{ inputs.enable_opencl }}"
            echo "- Hexagon (NPU): ${{ inputs.enable_hexagon }}"
            echo "- Ephemeral signing key: ${{ steps.keystore.outputs.ephemeral }}"
            echo "  (set the KEYSTORE_B64 secret to keep the same signing identity across runs)"
          } >> "$GITHUB_STEP_SUMMARY"
